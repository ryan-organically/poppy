<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Jerome Crist II - In Loving Memory (1930-2025)</title>
  <meta name="description" content="In loving memory of Jerome Crist II (1930-2025). A true and honorable man, a husband of 50 years, a father for 66.">

  <!-- Favicon -->
  <link rel="icon" type="image/jpeg" href="media/Jerome Crist Portrait.jpg">
  <link rel="apple-touch-icon" href="media/Jerome Crist Portrait.jpg">

  <!-- OpenGraph (social sharing) -->
  <meta property="og:title" content="Jerome Crist II - In Loving Memory">
  <meta property="og:description" content="A true and honorable man. A husband of 50 years, a father for 66. (1930-2025)">
  <meta property="og:image" content="https://jeromecrist.com/media/Jerome%20Crist%20Portrait.jpg">
  <meta property="og:url" content="https://jeromecrist.com">
  <meta property="og:type" content="website">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Jerome Crist II - In Loving Memory">
  <meta name="twitter:description" content="A true and honorable man. A husband of 50 years, a father for 66. (1930-2025)">
  <meta name="twitter:image" content="https://jeromecrist.com/media/Jerome%20Crist%20Portrait.jpg">
  <style>
    /* ============================================
       BASE STYLES
       ============================================ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'Georgia', 'Times New Roman', serif;
      background: #000;
      color: #fff;
    }

    /* ============================================
       SLIDESHOW CONTAINER
       ============================================ */
    .slideshow {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
    }

    /* ============================================
       HEADER
       ============================================ */
    .header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 30px 30px 50px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.4) 60%, transparent 100%);
      z-index: 100;
      text-align: center;
      opacity: 1;
      transition: opacity 0.5s ease;
    }

    .header.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .header h1 {
      font-size: 1.8rem;
      font-weight: normal;
      letter-spacing: 0.1em;
      margin-bottom: 5px;
    }

    .header .subtitle {
      font-size: 1.2rem;
      opacity: 0.9;
      font-style: italic;
    }

    .header .dates {
      font-size: 1rem;
      opacity: 0.7;
      margin-top: 5px;
      letter-spacing: 0.2em;
    }

    /* ============================================
       SLIDES
       ============================================ */
    .slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      opacity: 0;
      transition: opacity 1s ease;
      pointer-events: none;
    }

    .slide.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* Photo Slides */
    .slide-photo {
      padding: 120px 40px 100px;
      flex-direction: column;
    }

    .slide-photo.portrait {
      flex-direction: row;
      gap: 50px;
      padding: 120px 60px 100px;
    }

    .slide-photo.portrait.caption-left {
      flex-direction: row-reverse;
    }

    .slide-photo .photo-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      max-height: 100%;
    }

    .slide-photo img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 2px;
      box-shadow: 0 10px 50px rgba(0,0,0,0.5);
    }

    .slide-photo.portrait img {
      max-height: 70vh;
    }

    .slide-photo.landscape img {
      max-height: 60vh;
    }

    /* Video Slides */
    .slide-video {
      padding: 80px 20px 100px;
    }

    .slide-video video {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 2px;
      box-shadow: 0 10px 50px rgba(0,0,0,0.5);
    }

    /* Text Slides */
    .slide-text {
      text-align: center;
      padding: 40px;
    }

    .slide-text .content {
      font-size: 3rem;
      font-weight: normal;
      line-height: 1.4;
      max-width: 800px;
      text-shadow: 0 2px 20px rgba(0,0,0,0.5);
    }

    .slide-text .text-subtitle {
      font-size: 1.5rem;
      opacity: 0.8;
      margin-top: 20px;
      font-style: italic;
    }

    /* Caption - Default (landscape: below photo) */
    .caption {
      text-align: center;
      padding: 25px 30px;
      font-size: 1.3rem;
      font-style: italic;
      opacity: 0.9;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
      max-width: 600px;
    }

    /* Caption for landscape photos - underneath */
    .slide-photo.landscape .caption {
      margin-top: 20px;
    }

    /* Caption for portrait photos - beside */
    .slide-photo.portrait .caption {
      display: flex;
      align-items: center;
      justify-content: center;
      max-width: 300px;
      text-align: left;
      font-size: 1.5rem;
      line-height: 1.6;
    }

    /* ============================================
       CONTROLS
       ============================================ */
    .controls {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 15px 20px;
      background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, transparent 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 100;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .controls-buttons {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    .slideshow:hover .controls,
    .controls.visible {
      opacity: 1;
    }

    .control-btn {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      color: #fff;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      font-size: 1.2rem;
    }

    .control-btn:hover {
      background: rgba(255,255,255,0.25);
      transform: scale(1.1);
    }

    .control-btn:active {
      transform: scale(0.95);
    }

    /* Progress Bar */
    .progress-container {
      position: absolute;
      bottom: 70px;
      left: 20px;
      right: 20px;
      height: 3px;
      background: rgba(255,255,255,0.2);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: rgba(255,255,255,0.6);
      width: 0%;
      transition: width 0.3s ease;
    }

    /* Slide Counter */
    .slide-counter {
      position: absolute;
      right: 70px;
      font-size: 0.9rem;
      opacity: 0.7;
    }

    /* Fullscreen Button */
    .fullscreen-btn {
      position: absolute;
      right: 15px;
    }

    /* Pause Indicator */
    .pause-indicator {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      background: rgba(0,0,0,0.7);
      border-radius: 50%;
      width: 100px;
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      opacity: 0;
      transition: all 0.3s ease;
      pointer-events: none;
      z-index: 200;
    }

    .pause-indicator.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    /* ============================================
       RESPONSIVE STYLES
       ============================================ */
    @media (max-width: 768px) {
      .header h1 {
        font-size: 1.4rem;
      }

      .header .subtitle {
        font-size: 1rem;
      }

      .slide-text .content {
        font-size: 2rem;
      }

      .slide-text .text-subtitle {
        font-size: 1.2rem;
      }

      .caption {
        font-size: 1rem;
        padding: 15px 20px;
      }

      .slide-photo.portrait .caption {
        font-size: 1.1rem;
      }

      .control-btn {
        width: 44px;
        height: 44px;
      }
    }

    @media (max-width: 500px) {
      .slide-photo.portrait {
        flex-direction: column;
        gap: 20px;
      }

      .slide-photo.portrait .caption {
        text-align: center;
      }
    }

    /* ============================================
       LOADING STATE
       ============================================ */
    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 1.2rem;
      opacity: 0.7;
    }

    .loading.hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="slideshow" id="slideshow">
    <!-- Header -->
    <div class="header" id="header">
      <h1 id="headerTitle"></h1>
      <div class="subtitle" id="headerSubtitle"></div>
      <div class="dates" id="headerDates"></div>
    </div>

    <!-- Slides Container -->
    <div id="slidesContainer"></div>

    <!-- Pause Indicator -->
    <div class="pause-indicator" id="pauseIndicator">||</div>

    <!-- Progress Bar -->
    <div class="progress-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <!-- Controls -->
    <div class="controls" id="controls">
      <button class="control-btn" id="playPauseBtn" aria-label="Play/Pause">||</button>
      <div class="slide-counter" id="slideCounter">1 / 1</div>
      <button class="control-btn fullscreen-btn" id="fullscreenBtn" aria-label="Fullscreen">⛶</button>
    </div>

    <!-- Loading -->
    <div class="loading" id="loading">Loading slideshow...</div>
  </div>

  <!-- Load configuration -->
  <script src="slides.js"></script>

  <!-- Slideshow Engine -->
  <script>
    // ============================================
    // SLIDESHOW ENGINE
    // ============================================

    class MemorialSlideshow {
      constructor(config) {
        this.config = config;
        this.currentSlide = 0;
        this.isPlaying = !config.startPaused;
        this.autoPlayTimer = null;
        this.touchStartX = 0;
        this.touchEndX = 0;

        this.init();
      }

      init() {
        this.setupHeader();
        this.createSlides();
        this.setupControls();
        this.setupKeyboard();
        this.setupTouch();
        this.hideLoading();
        this.showSlide(0);

        if (this.isPlaying) {
          this.startAutoPlay();
        }

        this.updatePlayPauseButton();
      }

      setupHeader() {
        const header = document.getElementById('header');
        const title = document.getElementById('headerTitle');
        const subtitle = document.getElementById('headerSubtitle');
        const dates = document.getElementById('headerDates');

        if (!this.config.showHeader) {
          header.classList.add('hidden');
          return;
        }

        title.textContent = this.config.title || '';
        subtitle.textContent = this.config.subtitle || '';
        dates.textContent = this.config.dates || '';

        // Hide empty elements
        if (!this.config.subtitle) subtitle.style.display = 'none';
        if (!this.config.dates) dates.style.display = 'none';
      }

      createSlides() {
        const container = document.getElementById('slidesContainer');

        this.config.slides.forEach((slide, index) => {
          const slideEl = document.createElement('div');
          slideEl.className = `slide slide-${slide.type}`;
          slideEl.dataset.index = index;

          if (slide.type === 'photo') {
            const img = document.createElement('img');
            img.src = slide.src;
            img.alt = slide.caption || 'Memorial photo';
            img.loading = 'lazy';

            // Detect orientation once image loads
            img.onload = function() {
              if (img.naturalHeight > img.naturalWidth) {
                slideEl.classList.add('portrait');
                if (slide.captionLeft) {
                  slideEl.classList.add('caption-left');
                }
              } else {
                slideEl.classList.add('landscape');
              }
            };

            slideEl.appendChild(img);

            if (slide.caption) {
              const caption = document.createElement('div');
              caption.className = 'caption';
              caption.textContent = slide.caption;
              slideEl.appendChild(caption);
            }
          }
          else if (slide.type === 'video') {
            const video = document.createElement('video');
            video.src = slide.src;
            video.controls = true;
            video.playsInline = true;
            video.preload = 'metadata';

            // Auto-advance when video ends
            video.addEventListener('ended', () => {
              if (this.isPlaying) {
                this.nextSlide();
              }
            });

            slideEl.appendChild(video);

            if (slide.caption) {
              const caption = document.createElement('div');
              caption.className = 'caption';
              caption.textContent = slide.caption;
              slideEl.appendChild(caption);
            }
          }
          else if (slide.type === 'text') {
            const content = document.createElement('div');
            content.className = 'content';
            content.textContent = slide.content;
            slideEl.appendChild(content);

            if (slide.subtitle) {
              const sub = document.createElement('div');
              sub.className = 'text-subtitle';
              sub.textContent = slide.subtitle;
              slideEl.appendChild(sub);
            }
          }

          container.appendChild(slideEl);
        });

        this.slides = container.querySelectorAll('.slide');
        this.updateCounter();
      }

      setupControls() {
        const playPauseBtn = document.getElementById('playPauseBtn');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const slideshow = document.getElementById('slideshow');

        playPauseBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          this.togglePlayPause();
        });

        fullscreenBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          this.toggleFullscreen();
        });

        // Click on slideshow to toggle play/pause
        slideshow.addEventListener('click', (e) => {
          if (e.target === slideshow || e.target.classList.contains('slide') ||
              e.target.tagName === 'IMG') {
            this.togglePlayPause();
            this.showPauseIndicator();
          }
        });
      }

      setupKeyboard() {
        document.addEventListener('keydown', (e) => {
          switch(e.key) {
            case 'ArrowLeft':
              this.prevSlide();
              break;
            case 'ArrowRight':
              this.nextSlide();
              break;
            case ' ':
              e.preventDefault();
              this.togglePlayPause();
              this.showPauseIndicator();
              break;
            case 'Escape':
              if (document.fullscreenElement) {
                document.exitFullscreen();
              }
              break;
            case 'f':
            case 'F':
              this.toggleFullscreen();
              break;
          }
        });
      }

      setupTouch() {
        const slideshow = document.getElementById('slideshow');

        slideshow.addEventListener('touchstart', (e) => {
          this.touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        slideshow.addEventListener('touchend', (e) => {
          this.touchEndX = e.changedTouches[0].screenX;
          this.handleSwipe();
        }, { passive: true });
      }

      handleSwipe() {
        const threshold = 50;
        const diff = this.touchStartX - this.touchEndX;

        if (Math.abs(diff) > threshold) {
          if (diff > 0) {
            this.nextSlide();
          } else {
            this.prevSlide();
          }
        }
      }

      showSlide(index) {
        // Handle wrap-around
        if (index >= this.slides.length) index = 0;
        if (index < 0) index = this.slides.length - 1;

        // Pause any playing videos
        this.slides.forEach(slide => {
          const video = slide.querySelector('video');
          if (video) {
            video.pause();
            video.currentTime = 0;
          }
        });

        // Update active slide
        this.slides.forEach(slide => slide.classList.remove('active'));
        this.slides[index].classList.add('active');
        this.currentSlide = index;

        // Auto-play video if it's a video slide
        const currentSlideEl = this.slides[index];
        const video = currentSlideEl.querySelector('video');
        if (video && this.isPlaying) {
          this.stopAutoPlay();
          video.play().catch(() => {});
        }

        this.updateCounter();
        this.updateProgressBar();
      }

      nextSlide() {
        this.showSlide(this.currentSlide + 1);
        this.restartAutoPlay();
      }

      prevSlide() {
        this.showSlide(this.currentSlide - 1);
        this.restartAutoPlay();
      }

      togglePlayPause() {
        this.isPlaying = !this.isPlaying;

        if (this.isPlaying) {
          this.startAutoPlay();
          // Resume video if on video slide
          const video = this.slides[this.currentSlide].querySelector('video');
          if (video) video.play().catch(() => {});
        } else {
          this.stopAutoPlay();
          // Pause video if on video slide
          const video = this.slides[this.currentSlide].querySelector('video');
          if (video) video.pause();
        }

        this.updatePlayPauseButton();
      }

      startAutoPlay() {
        // Don't auto-advance on video slides
        const currentSlideEl = this.slides[this.currentSlide];
        if (currentSlideEl.querySelector('video')) return;

        this.stopAutoPlay();
        this.autoPlayTimer = setInterval(() => {
          this.nextSlide();
        }, this.config.autoPlayInterval || 6000);
      }

      stopAutoPlay() {
        if (this.autoPlayTimer) {
          clearInterval(this.autoPlayTimer);
          this.autoPlayTimer = null;
        }
      }

      restartAutoPlay() {
        if (this.isPlaying) {
          this.startAutoPlay();
        }
      }

      updatePlayPauseButton() {
        const btn = document.getElementById('playPauseBtn');
        btn.textContent = this.isPlaying ? '||' : '▶';
        btn.setAttribute('aria-label', this.isPlaying ? 'Pause' : 'Play');
      }

      updateCounter() {
        const counter = document.getElementById('slideCounter');
        counter.textContent = `${this.currentSlide + 1} / ${this.slides.length}`;
      }

      updateProgressBar() {
        const bar = document.getElementById('progressBar');
        const progress = ((this.currentSlide + 1) / this.slides.length) * 100;
        bar.style.width = `${progress}%`;
      }

      showPauseIndicator() {
        const indicator = document.getElementById('pauseIndicator');
        indicator.textContent = this.isPlaying ? '▶' : '||';
        indicator.classList.add('show');

        setTimeout(() => {
          indicator.classList.remove('show');
        }, 800);
      }

      toggleFullscreen() {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen();
        }
      }

      hideLoading() {
        document.getElementById('loading').classList.add('hidden');
      }
    }

    // Initialize slideshow when page loads
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof config !== 'undefined') {
        new MemorialSlideshow(config);
      } else {
        document.getElementById('loading').textContent =
          'Error: slides.js not found. Please create a slides.js file.';
      }
    });
  </script>
</body>
</html>
